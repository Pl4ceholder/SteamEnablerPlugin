name: Build Release

on:
  release:
    types: [ published ]



defaults:
  run:
    shell: bash

permissions:
  contents: write



jobs:
  build_release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Project
        run: dotnet build -c Release

      - name: Update Release with Binaries
        run: |-
          curl --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            'https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=SteamEnablerPlugin.dll' \
            --data-binary "@./src/SteamEnablerPlugin/bin/Release/net9.0/SteamEnablerPlugin.dll"
